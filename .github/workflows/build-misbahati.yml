name: Build Misbahati APK
on:
  push:
    branches: [ main ]
    paths:
      - 'tasbeeh/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-misbahati.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Misbahati
        run: gradle --no-daemon :tasbeeh:assembleDebug
      - name: Verify APK
        run: |
          test -s tasbeeh/build/outputs/apk/debug/tasbeeh-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging tasbeeh/build/outputs/apk/debug/tasbeeh-debug.apk | grep -q "com.misbahati.app"
          sha256sum tasbeeh/build/outputs/apk/debug/tasbeeh-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MISBAHATI-debug
          path: tasbeeh/build/outputs/apk/debug/tasbeeh-debug.apk
