name: Build SHADOW X from source ZIP
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SHADOW-X-AI-source-v3.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract prepared Android project
        run: |
          test -f SHADOW-X-AI-source-v3.zip
          unzip -o SHADOW-X-AI-source-v3.zip -d .
          test -f app/src/main/assets/index.html
          test -f app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-X-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
