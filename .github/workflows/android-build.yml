name: Build SHADOW X APK

on:
  workflow_dispatch:
  push:
    branches: [ main, shadow-ai-integration ]
    paths:
      - 'app/**'
      - 'app.zip'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore app web assets if missing
        shell: bash
        run: |
          if [ ! -f app/src/main/assets/index.html ]; then
            test -f app.zip
            unzip -l app.zip | grep -q 'app/src/main/assets/index.html'
            mkdir -p app/src/main/assets
            unzip -p app.zip app/src/main/assets/index.html > app/src/main/assets/index.html
          fi
          test -s app/src/main/assets/index.html

      - name: Verify Android project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/shadowx/recon/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-X-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
