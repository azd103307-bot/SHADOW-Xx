name: Build TEN PHONE MASTER APK
on:
  workflow_dispatch:
  push:
    branches: [ main, ten-phone-master ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
concurrency:
  group: ten-phone-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify installable APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.shadow.xx' versionCode='4' versionName='1.3.0'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-BUILD-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build TEN PHONE MASTER APK
        run: gradle --no-daemon :phonemaster:assembleDebug
      - name: Verify TEN PHONE MASTER APK
        run: |
          test -s phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging phonemaster/build/outputs/apk/debug/phonemaster-debug.apk | grep -q "package: name='com.ten.phonemaster'"
          sha256sum phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
      - name: Upload TEN PHONE MASTER APK
        uses: actions/upload-artifact@v4
        with:
          name: TEN-PHONE-MASTER-debug
          path: phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
      - name: Android 12 device smoke tests
        continue-on-error: true
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
