name: Build TEN PHONE MASTER APK
on:
  workflow_dispatch:
  push:
    branches: [ ten-phone-master ]
    paths:
      - 'phonemaster/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk.yml'
concurrency:
  group: ten-phone-master-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build TEN PHONE MASTER APK
        run: gradle --no-daemon :phonemaster:assembleDebug
      - name: Verify installable APK
        run: |
          test -s phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging phonemaster/build/outputs/apk/debug/phonemaster-debug.apk | grep -q "package: name='com.ten.phonemaster'"
          sha256sum phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
      - name: Upload TEN PHONE MASTER APK
        uses: actions/upload-artifact@v4
        with:
          name: TEN-PHONE-MASTER-debug
          path: phonemaster/build/outputs/apk/debug/phonemaster-debug.apk
