name: Build Five 3D Games APK
on:
  push:
    branches: [ arena-5-games ]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/build-arena.yml'
      - 'build.gradle.kts'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original high-resolution game worlds
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python tools/generate_world_assets.py
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.shadow.xx'"
          $ANDROID_HOME/build-tools/35.0.0/aapt list app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/worlds/city_ground.png'
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIVE-3D-GAMES-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
