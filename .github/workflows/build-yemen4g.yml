name: Build Yemen 4G APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'yemen4g/**'
      - '.github/workflows/build-yemen4g.yml'
concurrency:
  group: yemen4g-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon -p yemen4g assembleDebug
      - name: Verify APK
        run: |
          test -s yemen4g/app/build/outputs/apk/debug/app-debug.apk
          sha256sum yemen4g/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yemen-4G-debug
          path: yemen4g/app/build/outputs/apk/debug/app-debug.apk
