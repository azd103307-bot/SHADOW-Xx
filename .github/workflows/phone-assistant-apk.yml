name: Build NOVA Phone Assistant APK
on:
  workflow_dispatch:
  push:
    paths:
      - "phone-assistant/**"
      - ".github/workflows/phone-assistant-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: phone-assistant
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Phone-Assistant-APK
          path: phone-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
