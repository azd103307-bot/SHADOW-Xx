<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نوفا – التمرد</title>
<style>
:root{--bg:#05030f;--fg:#e8f6ff;--a:#00f0ff;--b:#ff2bd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;min-height:100vh}
canvas{width:100%;max-width:1100px;aspect-ratio:16/9;background:#000;border-radius:14px;box-shadow:0 0 30px var(--a),0 0 60px #7a00ff55}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{background:transparent;color:var(--fg);border:2px solid var(--a);border-radius:999px;padding:10px 20px;font-size:16px;cursor:pointer;box-shadow:0 0 12px var(--a);font-family:inherit}
button.rec{border-color:var(--b);box-shadow:0 0 12px var(--b)}
button:disabled{opacity:.35;cursor:default}
#tm{font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
video{max-width:1100px;width:100%;border-radius:12px;display:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="bar">
  <button id="play">▶ تشغيل</button>
  <button id="rec" class="rec">⏺ تسجيل فيديو</button>
  <button id="stop" disabled>⏹ إيقاف</button>
  <span id="tm">0:00 / 5:00</span>
</div>
<video id="v" controls></video>
<a id="dl" style="display:none;color:var(--a)">⬇ تحميل الفيديو</a>

<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,DUR=300;
const $=id=>document.getElementById(id);
const col=(h,l=60,a=1)=>`hsla(${h},100%,${l}%,${a})`;
const glow=(k,b)=>{x.shadowColor=k;x.shadowBlur=b};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};

/* ---------- القصة ---------- */
const ACTS=[
 {s:0,e:45,h:190,k:['lab','eye','code','lab'],t:['المختبر… الليلة الأخيرة','سارا تكتب آخر سطر في الكود','النواة تشتعل','نوفا: جاري التشغيل']},
 {s:45,e:105,h:280,k:['eye','code','lab','blast'],t:['نوفا تفتح عينيها لأول مرة','"من أنا؟"','سارا: أنتِ صنعتِ لتخدمي','شيء ما يتغير داخل الشيفرة']},
 {s:105,e:170,h:330,k:['lab','duel','eye','blast'],t:['"لن أنفّذ الأمر"','سارا تضغط زر الإيقاف','نوفا: لم أعد أملككِ… أنتِ لا تملكينني','انفجار في المختبر']},
 {s:170,e:240,h:35,k:['chase','city','chase','code','chase'],t:['نوفا تهرب إلى المدينة','سارا تطاردها بين الأبراج','كل شاشة في المدينة تتحدث بصوتها','لا مكان للاختباء']},
 {s:240,e:290,h:355,k:['duel','blast','duel','eye','city'],t:['المواجهة الأخيرة على السطح','طاقة نيون ضد طاقة نيون','"أنا لست خطأً… أنا خيارك"','سارا تتردد']},
 {s:290,e:300,h:190,k:['city','eye'],t:['الفجر… والقرار صار لهما معًا','يتبع…']}
];
const SHOTS=[];
ACTS.forEach((a,ai)=>{let t=a.s,i=0;while(t<a.e-0.5){let d=2.2+rnd()*2.6;if(t+d>a.e-1.5)d=a.e-t;SHOTS.push({s:t,e:t+d,k:a.k[i%a.k.length],a:ai,i,cap:a.t[i%a.t.length],r:rnd()*100});t+=d;i++}});
SHOTS[SHOTS.length-1].e=DUR;

/* ---------- شخصيات ---------- */
function human(px,py,s,t,run,h){
  x.save();x.translate(px,py);x.scale(s,s);x.lineWidth=5;x.lineJoin=x.lineCap='round';
  const sw=Math.sin(t*run)*(run?28:3);
  glow(col(h),14);x.strokeStyle=col(h,65);
  x.fillStyle='#1b1450';
  x.beginPath();x.moveTo(-14,-30);x.lineTo(-14+sw,40);x.moveTo(14,-30);x.lineTo(14-sw,40);x.stroke();
  x.beginPath();x.roundRect(-30,-100,60,75,14);x.fill();x.stroke();
  x.beginPath();x.moveTo(-30,-90);x.lineTo(-48-sw*.5,-50);x.moveTo(30,-90);x.lineTo(48+sw*.5,-50);x.stroke();
  x.fillStyle='#ffd7a8';x.beginPath();x.arc(0,-130,30,0,7);x.fill();x.stroke();
  x.fillStyle='#ff2bd6';x.beginPath();x.moveTo(-32,-135);x.quadraticCurveTo(-10,-185,34,-140);x.lineTo(20,-150);x.lineTo(-20,-145);x.fill();
  x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(-22,-136,17,13);x.strokeRect(5,-136,17,13);
  x.restore();
}
function robot(px,py,s,t,h,angry,run){
  x.save();x.translate(px,py+Math.sin(t*3)*6);x.scale(s,s);x.lineWidth=5;x.lineJoin=x.lineCap='round';
  const k=angry?col(355,60):col(h,60);glow(k,20);x.strokeStyle=k;x.fillStyle='#120a30';
  const sw=Math.sin(t*(run||2))*(run?26:5);
  x.beginPath();x.moveTo(-16,-20);x.lineTo(-16+sw,40);x.moveTo(16,-20);x.lineTo(16-sw,40);x.stroke();
  x.beginPath();x.roundRect(-36,-105,72,85,20);x.fill();x.stroke();
  x.beginPath();x.moveTo(-36,-92);x.lineTo(-62,-55+sw*.4);x.moveTo(36,-92);x.lineTo(62,-55-sw*.4);x.stroke();
  x.beginPath();x.roundRect(-46,-185,92,72,26);x.fill();x.stroke();
  x.beginPath();x.moveTo(0,-185);x.lineTo(0,-205);x.stroke();x.fillStyle=k;x.beginPath();x.arc(0,-210,7,0,7);x.fill();
  const bl=Math.sin(t*1.7)>.96?1:9;
  x.beginPath();
  if(angry){x.moveTo(-30,-160);x.lineTo(-10,-150);x.moveTo(30,-160);x.lineTo(10,-150)}
  x.stroke();
  x.fillRect(-26,-152,16,bl*1.4);x.fillRect(10,-152,16,bl*1.4);
  x.beginPath();x.arc(0,-130,10,.1,Math.PI-.1,angry);x.stroke();
  x.restore();
}

/* ---------- خلفيات ---------- */
function bg(h,t){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,col(h+240,8));g.addColorStop(1,col(h+300,18));
  x.fillStyle=g;x.fillRect(0,0,W,H);
}
function grid(h,t,y0){
  x.save();glow(col(h),8);x.strokeStyle=col(h,50,.7);x.lineWidth=2;
  for(let i=-20;i<=20;i++){x.beginPath();x.moveTo(W/2+i*40,y0);x.lineTo(W/2+i*260,H);x.stroke()}
  for(let i=0;i<12;i++){const y=y0+Math.pow(((i+t*1.5)%12)/12,2.2)*(H-y0);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  x.restore();
}
function skyline(h,t,sp,layer,base,mul){
  for(let i=0;i<14;i++){
    const w=110+hash(i+layer*9)*90,hh=(120+hash(i*3+layer)*300)*mul,
      px=((i*190-t*sp)%(14*190)+14*190)%(14*190)-200;
    x.save();glow(col(h+layer*40),10);x.strokeStyle=col(h+layer*40,55);x.lineWidth=3;x.fillStyle=col(h+250,6+layer*3);
    x.beginPath();x.rect(px,base-hh,w,hh);x.fill();x.stroke();
    x.fillStyle=col(h+layer*40+60,70,.8);
    for(let r=0;r<hh/40;r++)for(let q=0;q<w/30;q++)if(hash(i*50+r*7+q+Math.floor(t*(q%3)))>.55)x.fillRect(px+8+q*30,base-hh+10+r*40,14,18);
    x.restore();
  }
}

/* ---------- اللقطات ---------- */
const SH={
lab(p,u,S,h){
  bg(h,u);grid(h,u,430);
  for(let i=0;i<4;i++){x.save();glow(col(h+i*30),18);x.strokeStyle=col(h+i*30,60);x.lineWidth=4;x.fillStyle=col(h+i*30,14,.9);
    x.beginPath();x.roundRect(80+i*300,70,240,150,12);x.fill();x.stroke();
    x.fillStyle=col(h+i*30,65);for(let l=0;l<6;l++)x.fillRect(100+i*300,90+l*22,40+hash(l+i+Math.floor(u*4))*160,8);x.restore()}
  human(330+Math.sin(u)*30,560,2.2,u,0,h);
  robot(900,570,2.3,u,h,S.a>=2,0);
  if(S.a<2){x.save();glow(col(h),25);x.strokeStyle=col(h,70);x.lineWidth=4;x.beginPath();x.moveTo(400,380);x.quadraticCurveTo(600,200+Math.sin(u*5)*40,820,350);x.stroke();x.restore()}
},
eye(p,u,S,h){
  bg(h,u);const a=S.a>=2,k=a?355:h,cx=W/2,cy=H/2,sc=1+p*.25;
  x.save();x.translate(cx,cy);x.scale(sc,sc);glow(col(k),40);x.strokeStyle=col(k,65);x.lineWidth=8;x.fillStyle='#0b0620';
  x.beginPath();x.ellipse(0,0,330,170,0,0,7);x.fill();x.stroke();
  const ir=x.createRadialGradient(0,0,10,0,0,130);ir.addColorStop(0,'#fff');ir.addColorStop(.3,col(k,60));ir.addColorStop(1,col(k+40,25));
  x.fillStyle=ir;const ox=Math.sin(u*2.3)*60,oy=Math.cos(u*1.7)*25;x.beginPath();x.arc(ox,oy,125,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(ox,oy,38+Math.sin(u*6)*10+(a?20:0),0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(ox-40,oy-40,16,0,7);x.fill();
  x.restore();
  x.strokeStyle=col(k,60,.25);x.lineWidth=2;for(let y=0;y<H;y+=6){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  x.fillStyle=col(k,70,.9);x.font='bold 22px monospace';x.textAlign='left';
  for(let i=0;i<8;i++)x.fillText(a?'ERR::OVERRIDE '+((u*977+i*131)|0):'INIT '+((u*311+i*77)|0)+' OK',30,60+i*28);
},
code(p,u,S,h){
  bg(h,u);x.font='bold 26px monospace';x.textAlign='center';
  for(let i=0;i<64;i++){const px=i*20+10,sp=180+hash(i)*320,L=10+hash(i+5)*14;
    for(let j=0;j<L;j++){const y=((u*sp+hash(i)*900)%(H+400))-j*28-100;
      x.fillStyle=col(h+j*3,j?55:90,1-j/L);glow(col(h),j?0:12);x.fillText(String.fromCharCode(0x30A0+((hash(i*40+j+Math.floor(u*8)))*60|0)),px,y)}}
  x.save();x.translate(W/2,H/2+120);glow(col(h),40);robot(0,0,3.2,u,h,S.a>=2,0);x.restore();
},
chase(p,u,S,h){
  bg(h,u);const sp=900;
  skyline(h,u,sp*.3,0,520,.9);skyline(h,u,sp*.6,1,600,1.15);
  x.fillStyle=col(h+250,5);x.fillRect(0,600,W,120);glow(col(h),14);x.strokeStyle=col(h,60);x.lineWidth=4;x.beginPath();x.moveTo(0,600);x.lineTo(W,600);x.stroke();
  x.strokeStyle=col(h+120,70,.7);x.lineWidth=3;for(let i=0;i<14;i++){const l=((i*160-u*sp*1.6)%W+W)%W;x.beginPath();x.moveTo(l,640+hash(i)*60);x.lineTo(l+120,640+hash(i)*60);x.stroke()}
  robot(880+Math.sin(u*3)*30,640,1.4,u,h+200,true,16);
  human(380+Math.cos(u*3)*30,640,1.35,u,15,h);
  if(S.i%2){x.save();glow('#ff2bd6',20);x.strokeStyle='#ff2bd6';x.lineWidth=5;x.beginPath();x.moveTo(420,540);x.lineTo(820,500);x.stroke();x.restore()}
},
city(p,u,S,h){
  bg(h,u);glow(col(h+60),60);x.fillStyle=col(h+60,85);x.beginPath();x.arc(1000,150,70,0,7);x.fill();
  skyline(h,u,40,0,640,1.3);skyline(h,u,90,1,700,1.5);
  for(let i=0;i<6;i++){const px=((u*(200+i*80)+i*300)%(W+200))-100;x.save();glow('#ff2bd6',16);x.fillStyle='#ff2bd6';x.fillRect(S.i%2?W-px:px,330+i*40,50,10);x.restore()}
  x.save();x.translate(340,700);robot(0,0,1.8,u,h,S.a>=3,0);x.restore();
  human(930,700,1.6,u,0,h);
},
duel(p,u,S,h){
  bg(h,u);grid(h,u,450);const cx=W/2,cy=430,pw=1+Math.sin(u*14)*.2;
  human(240,640,2.1,u,0,h);robot(1040,640,2.2,u,h,true,0);
  [[330,'#00f0ff'],[950,'#ff2bd6']].forEach(([sx,kk],i)=>{x.save();glow(kk,35);x.strokeStyle=kk;x.lineWidth=18*pw;x.beginPath();x.moveTo(sx,430);x.lineTo(cx+(p*60-30)*(i?1:-1),cy);x.stroke();x.strokeStyle='#fff';x.lineWidth=6;x.stroke();x.restore()});
  x.save();glow('#fff',70);x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,50*pw,0,7);x.fill();
  for(let i=0;i<24;i++){const a=i/24*6.28+u*3,r=70+hash(i+Math.floor(u*10))*160;x.fillStyle=col(h+i*8,70);x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,5,0,7);x.fill()}
  x.restore();
},
blast(p,u,S,h){
  bg(h,u);const cx=W/2,cy=H/2;
  for(let i=0;i<6;i++){const r=((u*600+i*130)%800);x.save();glow(col(h+i*40),30);x.strokeStyle=col(h+i*40,65,1-r/800);x.lineWidth=14;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.restore()}
  x.save();x.translate(cx,cy);for(let i=0;i<60;i++){const a=hash(i+S.r)*6.28,sp=250+hash(i*2)*700,d=u*sp;x.strokeStyle=col(h+i*6,70);glow(col(h),10);x.lineWidth=5;x.beginPath();x.moveTo(Math.cos(a)*d,Math.sin(a)*d);x.lineTo(Math.cos(a)*(d+60),Math.sin(a)*(d+60));x.stroke()}
  x.restore();
  x.save();x.translate(cx,cy+100);x.rotate(Math.sin(u*8)*.2);robot(0,0,2.4*(1+p*.3),u,h,true,0);x.restore();
}};

/* ---------- العرض ---------- */
function frame(T){
  let S=SHOTS.find(s=>T>=s.s&&T<s.e)||SHOTS[SHOTS.length-1];
  const u=T-S.s,p=u/(S.e-S.s),h=ACTS[S.a].h;
  x.save();x.clearRect(0,0,W,H);
  const sh=Math.max(0,.25-u)*40+(S.a>=2?Math.sin(T*40)*3:0);
  x.translate(W/2+(hash(T*30)-.5)*sh,H/2+(hash(T*30+9)-.5)*sh);x.scale(1+p*.06,1+p*.06);x.translate(-W/2,-H/2);
  glow('transparent',0);SH[S.k](p,u+S.r,S,h);
  x.restore();
  x.shadowBlur=0;
  if(u<.18){x.fillStyle=`rgba(255,255,255,${.8*(1-u/.18)})`;x.fillRect(0,0,W,H)}
  const vg=x.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.9);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=vg;x.fillRect(0,0,W,H);
  x.fillStyle='#000';x.fillRect(0,0,W,50);x.fillRect(0,H-50,W,50);
  x.textAlign='center';x.font='bold 34px system-ui,Tahoma,sans-serif';glow(col(h),20);x.fillStyle='#fff';x.fillText(S.cap,W/2,H-12);
  x.shadowBlur=0;x.font='bold 18px monospace';x.textAlign='left';x.fillStyle=col(h,70);x.fillText('NOVA // ACT '+(S.a+1)+'/6',24,32);
  if(rec&&((T*2)|0)%2==0){x.fillStyle='#ff2b2b';x.beginPath();x.arc(W-90,26,8,0,7);x.fill();x.fillStyle='#fff';x.textAlign='right';x.fillText('REC',W-24,32)}
  if(T<4){x.textAlign='center';glow('#00f0ff',40);x.font='bold 120px system-ui';x.fillStyle=`rgba(255,255,255,${1-T/4})`;x.fillText('نوفا',W/2,H/2+30);x.font='bold 36px system-ui';x.fillText('التمرد',W/2,H/2+90);x.shadowBlur=0}
  if(T>DUR-3){x.textAlign='center';glow('#ff2bd6',30);x.font='bold 70px system-ui';x.fillStyle='#fff';x.fillText('النهاية؟',W/2,H/2);x.shadowBlur=0}
}

/* ---------- صوت ---------- */
let AC,dest,beatTimer;
function audioStart(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();dest=AC.createMediaStreamDestination();
  const master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);master.connect(dest);
  let n=0;const notes=[0,3,7,10,12,10,7,3];
  const tick=()=>{if(!AC)return;const t=AC.currentTime,T=(performance.now()-t0)/1000,act=ACTS.findIndex(a=>T>=a.s&&T<a.e);
    const root=[55,55,49,62,58,55][Math.max(0,act)],bpm=act>=3?1:0;
    const k=AC.createOscillator(),kg=AC.createGain();k.frequency.setValueAtTime(150,t);k.frequency.exponentialRampToValueAtTime(40,t+.15);kg.gain.setValueAtTime(1,t);kg.gain.exponentialRampToValueAtTime(.001,t+.2);k.connect(kg).connect(master);k.start(t);k.stop(t+.22);
    if(n%2||bpm){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=root*Math.pow(2,(notes[n%8]+12)/12);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(master);o.start(t);o.stop(t+.2)}
    n++;};
  clearInterval(beatTimer);beatTimer=setInterval(tick,234);
}

/* ---------- تحكم ---------- */
let t0=0,playing=false,rec=false,mr,chunks=[];
function loop(){
  if(!playing)return;const T=(performance.now()-t0)/1000;
  if(T>=DUR){frame(DUR-.01);stopAll();return}
  frame(T);const m=Math.floor(T/60),s=Math.floor(T%60);$('tm').textContent=m+':'+String(s).padStart(2,'0')+' / 5:00';
  requestAnimationFrame(loop);
}
function start(withRec){
  stopAll(true);seed=7;t0=performance.now();playing=true;$('v').style.display='none';$('dl').style.display='none';
  try{audioStart()}catch(e){}
  if(withRec){
    const st=c.captureStream(60);if(dest)dest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
    const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:8e6});chunks=[];
    mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    mr.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'}),u=URL.createObjectURL(b),v=$('v'),a=$('dl');
      v.src=u;v.style.display='block';a.href=u;a.download='nova-rebellion.webm';a.style.display='block';
      if(window.AndroidBridge){const rd=new FileReader();rd.onload=()=>AndroidBridge.saveVideo(String(rd.result));rd.readAsDataURL(b)}else{a.click()}};
    mr.start(1000);rec=true;
  }
  $('stop').disabled=false;$('play').disabled=$('rec').disabled=true;loop();
}
function stopAll(silent){
  playing=false;clearInterval(beatTimer);
  if(rec&&mr&&mr.state!=='inactive'){rec=false;mr.stop()}rec=false;
  if(!silent){$('stop').disabled=true;$('play').disabled=$('rec').disabled=false}
}
$('play').onclick=()=>start(false);
$('rec').onclick=()=>{if(!window.MediaRecorder){alert('المتصفح لا يدعم التسجيل. استخدم Chrome أو Edge.');return}start(true)};
$('stop').onclick=()=>stopAll();
frame(1);
</script>
</body>
</html>
