plugins { id 'com.android.application' }
android {
    namespace 'com.anzd.nova'
    compileSdk 35
    defaultConfig {
        applicationId 'com.anzd.nova'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

tasks.register('generateNovaLauncherIcon') {
    doLast {
        def iconDir = file('src/main/res/drawable-nodpi')
        iconDir.mkdirs()
        new File(iconDir, 'nova_icon.jpg').bytes = java.util.Base64.decoder.decode('')
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('generateNovaLauncherIcon')
}
