<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b3d"><link rel="manifest" href="./manifest.webmanifest">
<title>وِرد | المصحف الشريف</title>
<style>
:root{--bg:#f5f2e9;--paper:#fffdf7;--ink:#202820;--green:#174b3d;--gold:#c4a76b;--muted:#778078}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.hero{background:linear-gradient(140deg,#10392f,#24634d);color:#fff;padding:28px 18px 22px;text-align:center}.hero h1{margin:0;font-size:30px}.hero p{margin:8px 0 0;color:#e7dfc9}.wrap{max-width:850px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select,button{border:1px solid #d9d5c9;border-radius:12px;padding:11px;background:var(--paper);font:inherit;color:inherit}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}.panel{background:var(--paper);border:1px solid #e7e1d3;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #30220a0a}.ayah{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:27px;line-height:2.15;text-align:justify;white-space:normal}.ayah span{cursor:pointer;padding:2px}.ayah span:focus,.ayah span:hover{background:#efe6d2;border-radius:8px}.meta{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.surah-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.surah{padding:12px;border-radius:12px;background:#f3f0e7;text-align:right}.surah b{display:block;color:var(--green)}.hidden{display:none}.note{width:100%;min-height:70px;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit}footer{text-align:center;color:var(--muted);padding:24px;font-size:12px}
</style></head>
<body><header class="hero"><h1>۞ وِرد ۞</h1><p>المصحف الشريف · قراءة وتدبّر</p></header>
<main class="wrap">
<div class="toolbar"><input id="search" placeholder="ابحث في القرآن..." style="flex:1;min-width:180px"><button class="primary" id="find">بحث</button><button id="theme">الوضع الليلي</button></div>
<section class="panel"><div class="row"><div><b id="status">جارٍ تحميل المصحف...</b><div class="meta" id="progress">يلزم الاتصال بالإنترنت في أول تشغيل</div></div><button id="resume">آخر قراءة</button></div></section>
<section class="panel"><div class="row"><h3>فهرس السور</h3><select id="surahSelect"><option>اختر السورة</option></select></div><div id="surahList" class="surah-list"></div></section>
<section class="panel hidden" id="reader"><div class="row"><div><h2 id="surahTitle"></h2><div class="meta" id="surahInfo"></div></div><div><button id="prev">السابق</button> <button id="next">التالي</button></div></div><div class="ayah" id="text"></div><div class="row"><button id="bookmark">☆ حفظ علامة</button><button id="copy">نسخ السورة</button></div><hr><b>ملاحظاتك</b><textarea class="note" id="notes" placeholder="اكتب ملاحظة لهذه السورة..."></textarea><button id="saveNote">حفظ الملاحظة</button></section>
<section class="panel"><h3>علاماتك المحفوظة</h3><div id="marks" class="meta">لا توجد علامات بعد.</div></section>
<section class="panel"><h3>خطة الختمة</h3><p class="meta">اختر هدفًا يوميًا وتابع تقدمك محليًا على جهازك.</p><div class="row"><label>صفحات يوميًا <input id="daily" type="number" min="1" max="604" value="20" style="width:75px"></label><button id="saveGoal">حفظ الهدف</button></div><p id="goalInfo" class="meta"></p></section>
</main><footer>وِرد — قراءة فقط، بلا أصوات. بيانات العلامات والملاحظات تحفظ على جهازك.</footer>
<script>
const API='https://api.alquran.cloud/v1/quran/quran-uthmani';let surahs=[],current=0,bookmarks=JSON.parse(localStorage.getItem('wardMarks')||'[]');
const $=id=>document.getElementById(id);
async function load(){try{let cached=localStorage.getItem('wardQuran');if(cached){surahs=JSON.parse(cached);renderIndex();$('status').textContent='المصحف جاهز';$('progress').textContent='تم تحميل المصحف من ذاكرة الجهاز';}else{let r=await fetch(API);if(!r.ok)throw Error('network');let j=await r.json();surahs=j.data.surahs;if(surahs.length!==114||surahs.reduce((n,s)=>n+s.ayahs.length,0)!==6236)throw Error('validation');localStorage.setItem('wardQuran',JSON.stringify(surahs));renderIndex();$('status').textContent='اكتمل تحميل المصحف';$('progress').textContent='١١٤ سورة · ٦٢٣٦ آية';}renderMarks();let last=+(localStorage.getItem('wardLast')||0);if(last)openSurah(last-1,false);}catch(e){$('status').textContent='تعذر تحميل المصحف';$('progress').textContent='تحقق من الإنترنت ثم أعد فتح التطبيق. لا تعرض هذه النسخة نصًا قرآنيًا غير مكتمل.'}}
function renderIndex(){ $('surahList').innerHTML='';$('surahSelect').innerHTML='<option value="">اختر السورة</option>';surahs.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' - '+s.name;$('surahSelect').append(o);let b=document.createElement('button');b.className='surah';b.innerHTML='<b>'+String(i+1).padStart(3,'0')+' · '+s.name+'</b><small class="meta">'+s.ayahs.length+' آية · '+(s.revelationType==='Meccan'?'مكية':'مدنية')+'</small>';b.onclick=()=>openSurah(i);$('surahList').append(b)})}
function openSurah(i,save=true){if(!surahs[i])return;current=i;let s=surahs[i];$('reader').classList.remove('hidden');$('surahTitle').textContent=s.name;$('surahInfo').textContent='السورة '+(i+1)+' · '+s.ayahs.length+' آية · '+(s.revelationType==='Meccan'?'مكية':'مدنية');$('text').innerHTML=s.ayahs.map(a=>'<span tabindex="0" title="الآية '+a.numberInSurah+'">'+a.text+' ﴿'+a.numberInSurah+'﴾ </span>').join('');$('notes').value=localStorage.getItem('wardNote'+(i+1))||'';if(save)localStorage.setItem('wardLast',i+1);window.scrollTo({top:$('reader').offsetTop-10,behavior:'smooth'})}
$('surahSelect').onchange=e=>openSurah(+e.target.value);$('prev').onclick=()=>openSurah(Math.max(0,current-1));$('next').onclick=()=>openSurah(Math.min(113,current+1));$('resume').onclick=()=>{let n=+(localStorage.getItem('wardLast')||1);openSurah(n-1)};
$('bookmark').onclick=()=>{if(!bookmarks.includes(current+1))bookmarks.push(current+1);localStorage.setItem('wardMarks',JSON.stringify(bookmarks));renderMarks()};
function renderMarks(){$('marks').innerHTML=bookmarks.length?bookmarks.map(n=>'<button data-n="'+n+'">'+surahs[n-1]?.name+'</button>').join(' '):'لا توجد علامات بعد.';document.querySelectorAll('#marks button').forEach(b=>b.onclick=()=>openSurah(+b.dataset.n-1))}
$('saveNote').onclick=()=>{localStorage.setItem('wardNote'+(current+1),$('notes').value);alert('تم حفظ الملاحظة')};
$('copy').onclick=()=>navigator.clipboard?.writeText(surahs[current].ayahs.map(a=>a.text).join(' '));
$('find').onclick=()=>{let q=$('search').value.trim();if(!q)return;let hits=[];surahs.forEach((s,i)=>s.ayahs.forEach(a=>{if(a.text.includes(q))hits.push({i,n:a.numberInSurah,text:a.text})}));$('progress').textContent=hits.length?'نتائج البحث: '+hits.length+' آية':'لم توجد نتائج';if(hits.length){openSurah(hits[0].i);$('progress').textContent='أول نتيجة: '+surahs[hits[0].i].name+'، الآية '+hits[0].n+' — '+hits[0].text}};
$('saveGoal').onclick=()=>{localStorage.setItem('wardGoal',$('daily').value);$('goalInfo').textContent='هدفك اليومي: '+$('daily').value+' صفحة.'};$('goalInfo').textContent='هدفك اليومي: '+(localStorage.getItem('wardGoal')||20)+' صفحة.';
$('theme').onclick=()=>{let dark=document.body.dataset.dark!=='1';document.body.dataset.dark=dark?'1':'0';document.documentElement.style.setProperty('--bg',dark?'#151b18':'#f5f2e9');document.documentElement.style.setProperty('--paper',dark?'#202923':'#fffdf7');document.documentElement.style.setProperty('--ink',dark?'#f3f0e8':'#202820');document.documentElement.style.setProperty('--muted',dark?'#b8c0b9':'#778078')};
load();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
