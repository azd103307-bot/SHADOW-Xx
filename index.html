<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHADOW-X | Wi-Fi RECON</title>
  <style>
    @font-face {
      font-family: "Optimistic";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
    }
    @font-face {
      font-family: "Optimistic Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
    }
    :where(html) {
      font-family: "Optimistic", system-ui, sans-serif;
    }
    :where(code, pre, kbd, samp) {
      font-family: "Optimistic Mono", ui-monospace, monospace;
    }
  </style>
  <script>
    (function installDevicePermissionRuntime() {
      if (window.parent === window) {
        return;
      }
      let parentOrigin;
      try {
        const embeddingOrigin = window.location.ancestorOrigins?.[0] || document.referrer;
        const { hostname, origin, port, protocol } = new URL(embeddingOrigin);
        const supportedHost =
          hostname === "meta.ai" ||
          hostname === "ecto1.ai" ||
          [".meta.ai", ".ecto1.ai", ".internalfb.com", ".hatch.club"].some((suffix) =>
            hostname.endsWith(suffix)
          );
        if (
          (hostname === "localhost" && (protocol === "http:" || protocol === "https:")) ||
          (protocol === "https:" && port === "" && supportedHost)
        ) {
          parentOrigin = origin;
        }
      } catch {
        parentOrigin = undefined;
      }
      window.__SHADOW_PARENT_ORIGIN__ = parentOrigin;
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- بداية إضافة SHADOW AI -->
  <style>
    #shadowAIButton {
      position: fixed;
      bottom: 22px;
      left: 18px;
      z-index: 99990;
      padding: 14px 20px;
      border: 1px solid #56d7df;
      border-radius: 15px;
      background: #102b40;
      color: #8ffaff;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 0 5px 25px #0009;
      cursor: pointer;
    }
    #shadowAIPanel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #07111ff5;
      color: #edf5ff;
      padding: 16px;
      overflow: auto;
      font-family: system-ui, sans-serif;
    }
    #shadowAIBox {
      max-width: 760px;
      margin: 25px auto;
    }
    #shadowAIBox h2 {
      color: #5ce1e6;
    }
    #shadowAIQuestion {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 12px;
      background: #101e31;
      color: white;
      border: 1px solid #345;
      box-sizing: border-box;
    }
    #shadowAIResults {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }
    .shadowAISource {
      padding: 12px;
      border: 1px solid #29445d;
      border-radius: 12px;
      background: #101e31;
      overflow-wrap: anywhere;
    }
    .shadowAISource a {
      color: #70e5ec;
    }
    .shadowAIAction {
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #56d7df;
      color: #06222a;
      font-weight: bold;
      margin: 8px 4px;
      cursor: pointer;
    }
  </style>

  <button id="shadowAIButton" type="button">🧠 SHADOW AI</button>

  <div id="shadowAIPanel" role="dialog" aria-modal="true" aria-label="SHADOW AI">
    <div id="shadowAIBox">
      <button class="shadowAIAction" id="shadowAIClose" type="button">إغلاق ✕</button>
      <h2>SHADOW AI</h2>
      <p>مساعد البحث والتحليل متعدد المصادر</p>
      <textarea id="shadowAIQuestion" placeholder="اكتب سؤالك هنا..."></textarea>
      <button class="shadowAIAction" id="shadowAISearch" type="button">ابحث الآن 🔎</button>
      <div id="shadowAIStatus"></div>
      <div id="shadowAIResults"></div>
    </div>
  </div>

  <script>
    (function () {
      const button = document.getElementById("shadowAIButton");
      const panel = document.getElementById("shadowAIPanel");
      const close = document.getElementById("shadowAIClose");
      const search = document.getElementById("shadowAISearch");
      const question = document.getElementById("shadowAIQuestion");
      const status = document.getElementById("shadowAIStatus");
      const results = document.getElementById("shadowAIResults");

      function openPanel() {
        panel.style.display = "block";
        question.focus();
      }

      function closePanel() {
        panel.style.display = "none";
      }

      button.onclick = openPanel;
      close.onclick = closePanel;

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && panel.style.display === "block") {
          closePanel();
        }
      });

      function safeUrl(rawUrl) {
        try {
          const parsed = new URL(rawUrl);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "#";
        } catch {
          return "#";
        }
      }

      function addSource(item) {
        const card = document.createElement("div");
        card.className = "shadowAISource";

        const link = document.createElement("a");
        link.href = safeUrl(item.url);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.title;

        const description = document.createElement("p");
        description.textContent = item.text || "لا يوجد ملخص متاح.";

        const provider = document.createElement("small");
        provider.textContent = item.provider;

        card.append(link, description, provider);
        results.appendChild(card);
      }

      async function getJSON(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      }

      async function wikipedia(q) {
        const lang = /[ء-ي]/.test(q) ? "ar" : "en";
        const url =
          "https://" +
          lang +
          ".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" +
          encodeURIComponent(q) +
          "&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&exchars=500&format=json&origin=*";
        const data = await getJSON(url);
        return Object.values(data.query?.pages || {}).map((p) => ({
          title: p.title,
          text: p.extract || "",
          url: "https://" + lang + ".wikipedia.org/?curid=" + p.pageid,
          provider: "Wikipedia"
        }));
      }

      async function crossref(q) {
        const data = await getJSON(
          "https://api.crossref.org/works?query=" +
            encodeURIComponent(q) +
            "&rows=5"
        );
        return (data.message?.items || []).map((x) => ({
          title: x.title?.[0] || "بحث علمي",
          text: (x.abstract || "بيانات بحث علمي").replace(/<[^>]*>/g, " ").slice(0, 500),
          url: x.URL || "https://search.crossref.org/",
          provider: "Crossref"
        }));
      }

      async function openalex(q) {
        const data = await getJSON(
          "https://api.openalex.org/works?search=" +
            encodeURIComponent(q) +
            "&per-page=5"
        );
        return (data.results || []).map((x) => ({
          title: x.title || "بحث أكاديمي",
          text:
            "سنة النشر: " +
            (x.publication_year || "غير محددة") +
            " | الاستشهادات: " +
            (x.cited_by_count || 0),
          url: x.doi || x.primary_location?.landing_page_url || x.id || "#",
          provider: "OpenAlex"
        }));
      }

      search.onclick = async () => {
        const q = question.value.trim();
        if (!q) return;

        search.disabled = true;
        results.replaceChildren();
        status.textContent = "جارٍ البحث في المصادر العامة...";

        const tasks = await Promise.allSettled([
          wikipedia(q),
          crossref(q),
          openalex(q)
        ]);

        const items = tasks.flatMap((x) => (x.status === "fulfilled" ? x.value : []));
        items.forEach(addSource);

        const failed = tasks.filter((x) => x.status === "rejected").length;
        status.textContent = items.length
          ? "عُثر على " +
            items.length +
            " نتيجة. راجع المصادر قبل اعتماد المعلومات." +
            (failed ? " تعذر الوصول إلى " + failed + " مصدر." : "")
          : "لم تصل نتائج. تحقق من الإنترنت أو غيّر صياغة السؤال.";

        search.disabled = false;
      };
    })();
  </script>
  <!-- نهاية إضافة SHADOW AI -->
</body>
</html>
