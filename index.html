:root{
  --bg:#0a1020;
  --surface:#111d32;
  --surface2:#16263f;
  --surface3:#0f1a2e;
  --border:#22365a;
  --text:#e8f2ff;
  --muted:#9fb3cc;
  --cyan:#56d7df;
  --cyan-dim:#1f4b52;
  --green:#5fe3a1;
  --amber:#ffcf5c;
  --red:#ff7a7a;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#0a1020;
    --surface:#111d32;
    --surface2:#16263f;
    --surface3:#0f1a2e;
    --border:#22365a;
    --text:#e8f2ff;
    --muted:#9fb3cc;
    --cyan:#56d7df;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif
}

button,input,select,textarea{
  font-family:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  background:#0a1526;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(86,215,223,.18)
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px
}

.btn{
  background:#1a2e4d;
  border:1px solid #2b4a73;
  color:#eaf6ff;
  border-radius:10px;
  padding:11px 12px;
  font-weight:700;
  font-size:13px
}

.btn:hover{
  border-color:var(--cyan);
  background:#203a5e
}

.btn-primary{
  background:var(--cyan);
  color:#06222a;
  border-color:var(--cyan)
}

.btn-primary:hover{
  background:#7fe6ec
}

.btn-danger{
  background:#3a1a26;
  border-color:#6b2c3d;
  color:#ffd7dc
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.7
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:12px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  min-width:560px
}

th{
  text-align:start;
  background:#0f1c33;
  color:#bfeaf0;
  padding:10px 11px;
  border-bottom:1px solid var(--border);
  white-space:nowrap
}

td{
  padding:9px 11px;
  border-bottom:1px solid #1b2c49;
  vertical-align:top;
  overflow-wrap:anywhere
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#0f2b33;
  border:1px solid #2a7a82;
  color:#9beef3;
  border-radius:999px;
  padding:4px 10px;
  font-size:11px;
  font-weight:800
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  display:inline-block
}

.navbtn{
  width:100%;
  text-align:start;
  background:transparent;
  border:1px solid transparent;
  color:#c9d9ee;
  border-radius:11px;
  padding:11px 12px;
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:700;
  font-size:13px
}

.navbtn.active{
  background:#143242;
  border-color:#2a7a82;
  color:white
}

.chip{
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#0f1a2e
}

::-webkit-scrollbar{
  width:10px;
  height:10px
}

::-webkit-scrollbar-thumb{
  background:#2a4268;
  border-radius:99px
}
