<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="SHADOW AI — مساعد ذكاء اصطناعي للمحادثة">
<title>SHADOW AI</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101e31;--line:#263c59;--text:#edf5ff;--muted:#9eb2ca;--cyan:#5ce1e6;--green:#62dfa8;--danger:#ff8e8e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 85% -10%,#173b58 0,#07111f 48%);color:var(--text);font-family:system-ui,"Noto Sans Arabic",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,textarea{font:inherit}
.top{flex:0 0 auto;background:#07111ff2;border-bottom:1px solid var(--line);padding:11px 14px;padding-top:max(11px,env(safe-area-inset-top));}
.top-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#83f2ee,#2877a8);display:grid;place-items:center;color:#061321;font-weight:1000;font-size:23px;box-shadow:0 5px 25px #39cbd52b}
.brand h1{font-size:17px;margin:0;letter-spacing:.5px}
.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#8797aa}
.dot.online{background:var(--green);box-shadow:0 0 10px #62dfa866}
.clear{width:38px;height:38px;border:1px solid var(--line);background:#102238;color:var(--text);border-radius:12px}
main{flex:1;min-height:0;width:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;padding:15px 13px 8px}
#chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:5px 2px 15px;overscroll-behavior:contain;scroll-behavior:smooth}
.welcome{margin:auto;text-align:center;max-width:480px;padding:26px 12px;color:var(--muted);line-height:1.9}
.welcome-mark{width:66px;height:66px;margin:0 auto 15px;border-radius:22px;background:linear-gradient(135deg,#83f2ee,#2877a8);display:grid;place-items:center;color:#061321;font-weight:1000;font-size:34px}
.welcome h2{font-size:22px;color:var(--text);margin:0 0 7px}
.welcome p{font-size:13px;margin:0}
.bubble{max-width:min(86%,720px);padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);line-height:1.85;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 12px #00000012}
.bubble.user{align-self:flex-start;background:#123044;border-color:#245b70}
.bubble.assistant{align-self:flex-end}
.bubble.error{border-color:#8f4545;color:#ffd0d0}
.who{font-size:10px;color:var(--cyan);font-weight:900;margin-bottom:4px}
.bubble.user .who{color:#abd8ff}
.typing{display:flex;align-items:center;gap:5px;height:20px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 1s infinite alternate}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}
.composer-wrap{flex:0 0 auto;background:#07111ff5;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.composer{max-width:900px;margin:auto;display:flex;align-items:flex-end;gap:8px}
#question{flex:1;min-width:0;min-height:48px;max-height:145px;resize:none;overflow-y:auto;border:1px solid #34516b;border-radius:15px;background:#0e1b2d;color:var(--text);padding:12px 13px;font:inherit;font-size:14px;line-height:1.6;outline:none}
#question:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #5ce1e61c}
#question::placeholder{color:#8298b0}
.send{height:48px;min-width:78px;border:0;border-radius:14px;background:var(--cyan);color:#06212b;font-weight:1000;padding:0 16px}
.send:disabled{opacity:.5;cursor:default}
.hint{max-width:900px;margin:6px auto 0;color:#8298b0;font-size:10px;padding:0 3px}
@media(min-width:700px){main{padding-top:22px}.bubble{font-size:15px}.welcome h2{font-size:25px}}
</style>
</head>
<body>
<header class="top">
 <div class="top-inner">
  <div class="brand">
   <div class="logo" aria-hidden="true">S</div>
   <div><h1>SHADOW AI</h1><p>مساعد الذكاء الاصطناعي</p></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
   <div class="status" role="status" aria-live="polite"><span class="dot" id="statusDot"></span><span id="statusText">يتحقق من الاتصال</span></div>
   <button class="clear" id="clearBtn" title="محادثة جديدة" aria-label="محادثة جديدة">＋</button>
  </div>
 </div>
</header>
<main>
 <section id="chat" aria-live="polite" aria-label="المحادثة"></section>
</main>
<footer class="composer-wrap">
 <div class="composer">
  <textarea id="question" rows="1" maxlength="4000" placeholder="اكتب رسالتك إلى SHADOW AI..." aria-label="اكتب رسالتك"></textarea>
  <button class="send" id="sendBtn">إرسال</button>
 </div>
 <div class="hint">Enter للإرسال · Shift + Enter لسطر جديد</div>
</footer>
<script>
(function(){
"use strict";
const API_BASE="https://shadow-ai.azd103307.workers.dev";
const STORE_KEY="shadow-ai-chat-v3";
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendBtn=document.getElementById("sendBtn");
const statusText=document.getElementById("statusText");
const statusDot=document.getElementById("statusDot");
let busy=false;
let messages=[];

function loadMessages(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORE_KEY)||"[]");
  if(Array.isArray(saved))return saved.filter(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string").slice(-40);
 }catch(e){}
 return [];
}
function saveMessages(){
 try{localStorage.setItem(STORE_KEY,JSON.stringify(messages.slice(-40)))}catch(e){}
}
function setStatus(label,online){
 statusText.textContent=label;
 statusDot.className=online?"dot online":"dot";
}
function scrollBottom(){
 chat.scrollTop=chat.scrollHeight;
}
function addBubble(role,text,extra){
 const el=document.createElement("article");
 el.className="bubble "+role+(extra?" "+extra:"");
 const who=document.createElement("div");
 who.className="who";
 who.textContent=role==="user"?"أنت":"SHADOW AI";
 const body=document.createElement("div");
 body.textContent=text;
 el.append(who,body);
 chat.appendChild(el);
 return el;
}
function render(){
 chat.replaceChildren();
 if(!messages.length){
  const welcome=document.createElement("div");
  welcome.className="welcome";
  const mark=document.createElement("div");mark.className="welcome-mark";mark.textContent="S";
  const title=document.createElement("h2");title.textContent="مرحباً، أنا SHADOW AI";
  const desc=document.createElement("p");desc.textContent="اكتب سؤالك وسأساعدك. هذه مساحة محادثة مخصصة للذكاء الاصطناعي فقط.";
  welcome.append(mark,title,desc);chat.appendChild(welcome);
 }else{
  messages.forEach(m=>addBubble(m.role,m.content));
 }
 scrollBottom();
}
function addMessage(role,content){
 messages.push({role,content});
 messages=messages.slice(-40);
 saveMessages();
 addBubble(role,content);
 scrollBottom();
}
function showTyping(){
 const el=addBubble("assistant","");
 el.id="typingBubble";
 const body=el.lastElementChild;
 body.className="typing";
 body.innerHTML="<i></i><i></i><i></i>";
 scrollBottom();
}
async function checkHealth(){
 try{
  const r=await fetch(API_BASE+"/api/health",{headers:{"Accept":"application/json"}});
  const d=await r.json();
  const ready=r.ok&&d.aiBinding===true;
  setStatus(ready?"الذكاء متصل":"الخادم يحتاج إعداداً",ready);
 }catch(e){
  setStatus("غير متصل",false);
 }
}
async function sendMessage(){
 if(busy)return;
 const q=input.value.trim();
 if(!q)return;
 addMessage("user",q);
 input.value="";
 input.style.height="48px";
 busy=true;sendBtn.disabled=true;sendBtn.textContent="...";
 showTyping();
 try{
  const payload={messages:messages.slice(-10).map(m=>({role:m.role,content:m.content}))};
  const response=await fetch(API_BASE+"/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify(payload)
  });
  let data={};
  try{data=await response.json()}catch(e){}
  const typing=document.getElementById("typingBubble");if(typing)typing.remove();
  if(!response.ok){
   const message=typeof data.error==="string"?data.error:"تعذر الحصول على رد من النموذج.";
   addBubble("assistant","تعذر الرد: "+message,"error");
   setStatus("تعذر إكمال الطلب",false);
  }else{
   const reply=String(data.reply||data.response||"لم يصل نص من النموذج.");
   addMessage("assistant",reply);
   setStatus("الذكاء متصل",true);
  }
 }catch(e){
  const typing=document.getElementById("typingBubble");if(typing)typing.remove();
  addBubble("assistant","تعذر الوصول إلى خادم الذكاء الاصطناعي. تأكد من اتصال الإنترنت ومن إعداد خادم SHADOW AI.","error");
  setStatus("غير متصل",false);
 }finally{
  busy=false;sendBtn.disabled=false;sendBtn.textContent="إرسال";input.focus();scrollBottom();
 }
}
sendBtn.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
input.addEventListener("input",()=>{
 input.style.height="48px";
 input.style.height=Math.min(input.scrollHeight,145)+"px";
});
document.getElementById("clearBtn").addEventListener("click",()=>{
 if(busy)return;
 if(messages.length&&!confirm("بدء محادثة جديدة؟ سيتم مسح المحادثة المحفوظة على هذا الجهاز."))return;
 messages=[];saveMessages();render();input.focus();
});
messages=loadMessages();
render();
checkHealth();
})();
</script>
</body>
</html>
