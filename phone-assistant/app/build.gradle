plugins { id 'com.android.application' }

android {
    namespace 'com.nova.phoneassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nova.phoneassistant'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
}

dependencies {
    implementation 'com.rmtheis:tess-two:9.1.0'
}
